<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HAMZEHI SOCIAL AI V6.0</title><style>body{font-family:system-ui;background:#f4f4f2;margin:0}.w{max-width:850px;margin:auto;padding:16px}.c{background:#fff;padding:16px;border-radius:18px;margin:12px 0}input,button{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:12px;font:inherit}button{background:#111;color:#fff}pre{white-space:pre-wrap}</style><div class=w><h2>HAMZEHI SOCIAL AI V6.0</h2><input id=b placeholder="Worker URL"><input id=t placeholder="ADMIN TOKEN"><div class=c><button onclick=test()>Full Production Test</button><pre id=o></pre></div><div class=c><input id=id placeholder="Content ID"><button onclick=pub()>Publish Approved Content</button><pre id=p></pre></div><div class=c><button onclick=checks()>Release Checks</button><pre id=c></pre></div><script>
const $=x=>document.getElementById(x),base=()=>$('b').value.trim().replace(/\/$/,'');const h=()=>({Authorization:'Bearer '+$('t').value,'Content-Type':'application/json'});
async function api(p,o={}){let r=await fetch(base()+p,{...o,headers:{...h(),...(o.headers||{})}}),d=await r.json();if(!r.ok||d.ok===false)throw Error(d.error||'خطا');return d}
async function test(){try{$('o').textContent=JSON.stringify(await api('/api/release/test',{method:'POST'}),null,2)}catch(e){$('o').textContent=e.message}}
async function pub(){try{$('p').textContent=JSON.stringify(await api('/api/publish',{method:'POST',body:JSON.stringify({content_id:$('id').value,platform:'telegram'})}),null,2)}catch(e){$('p').textContent=e.message}}
async function checks(){try{$('c').textContent=JSON.stringify(await api('/api/release/checks'),null,2)}catch(e){$('c').textContent=e.message}}
</script></div>
