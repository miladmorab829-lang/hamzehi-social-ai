name = "hamzehi-social-ai"
main = "src/index.js"
compatibility_date = "2026-09-11"
compatibility_flags = ["global_fetch_strictly_public"]
[triggers]
crons = ["0 7 * * *","*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_id = "40b272c5-e368-4c33-8a41-7c63db98d7e8"

[ai]
binding = "AI"

# Private product-gallery originals (owner dashboard uploads only; no public access). Read only via /api/gallery/image (admin).
[[r2_buckets]]
binding = "GALLERY_BUCKET"
bucket_name = "hamzehi-gallery"

# Phase 18.5: isolated private bucket for the sealed open-dataset candidate file (dataset-discovery.js reads DATASET_DISCOVERY_KEY,
# default discovery/candidates-latest.json). Discovery behaviour is set by the DATASET_DISCOVERY vars below; an empty bucket imports nothing.
[[r2_buckets]]
binding = "DISCOVERY_BUCKET"
bucket_name = "hamzehi-discovery"

[vars]
OPENAI_MODEL = "gpt-5.6-luna"
# Telegram Sales Brain: AI-first understanding/drafting through the Sales AI Gateway (worker/src/sales-ai-brain.js), grounded and
# validated by the deterministic layer. "off" = the deterministic brain only. SALES_AI_MODEL (optional) overrides OPENAI_MODEL.
SALES_AI_BRAIN = "on"
# Explicit provider selection (no automatic fallback): "anthropic" uses the ANTHROPIC_API_KEY secret + ANTHROPIC_MODEL.
SALES_AI_PROVIDER = "anthropic"
ANTHROPIC_MODEL = "claude-opus-5-5"
SALES_AI_TIMEOUT_MS = "15000"
RATE_LIMIT_PER_MINUTE = "60"
TELEGRAM_VAULT_CHAT_ID = "@mhboxgroup"
TELEGRAM_VIDEO_VAULT_CHAT_ID = "@mhboxgroup"
AUTO_AI_MEDIA_ENABLED = "true"
# Bounded multi-agent orchestrator (autonomy-engine.js, heartbeat + Watchdog coverage). Approved Production setting since Stage 3;
# it lives here so every build path (wrangler deploy, versions upload, Workers Builds, GitHub Actions) carries it, not only uploads
# made with --var. Without it the Worker silently falls back to the legacy sequential task loop.
AUTONOMY_ORCHESTRATOR = "on"
# Google Places Ads discovery (worker/src/places-budget.js): one IDs-only Text Search per Ads run, D1 monthly ledger. Owner budget
# USD 10/month (2026-10-30); the code keeps a 20% margin (effective cap USD 8) and reserves IDs-only requests at the Pro price until
# ADS_PLACES_IDS_ONLY_BILLING_VERIFIED = "true" is set after Google Cloud billing shows them at $0.
ADS_PLACES_DISCOVERY = "on"
ADS_PLACES_MONTHLY_BUDGET_USD = "10"
# Phase 18.5: independent dataset discovery master switch. "off" = fully inert (no import, no dataset website checks), even with
# DISCOVERY_BUCKET bound.
# Activation configuration (2026-11-01): ON for IRAQ and IRAN, 1 per run / 10 per day each, 2 website checks per run. IRAN activated by the
# owner after confirming the account holder is not located in Iran / not SDN-listed and no US person is involved. Nothing is imported until the sealed
# candidate file is uploaded to the bucket (empty = no import). A market is disabled by setting its PER_RUN or DAILY_CAP to "0" (D-17).
# Emergency stop: redeploy the previous tagged version (a22839b3, "off").
DATASET_DISCOVERY = "on"
DATASET_DISCOVERY_IRAN_PER_RUN = "1"
DATASET_DISCOVERY_ARAB_PER_RUN = "1"
DATASET_DISCOVERY_IRAN_DAILY_CAP = "10"
DATASET_DISCOVERY_ARAB_DAILY_CAP = "10"
DATASET_DISCOVERY_VERIFY_PER_RUN = "2"
