name = "hamzehi-social-ai"
main = "src/index.js"
compatibility_date = "2026-09-11"
[triggers]
crons = ["0 7 * * *","*/15 * * * *"]
[[d1_databases]]
binding = "DB"
database_name = "hamzehi-social-ai"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
[vars]
OPENAI_MODEL = "gpt-5.6-luna"
RATE_LIMIT_PER_MINUTE = "60"
